<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>{% block title %}{% endblock %}</title>
        <meta name="description" content="description here">
        <meta name="keywords" content="keywords,here">

        <link href="https://fonts.googleapis.com/css?family=Nunito:400,700,800" rel="stylesheet">

        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

        <!-- Apply the saved/preferred theme before paint to avoid a flash -->
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem('theme');
                    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
                    document.documentElement.setAttribute('data-theme', theme);
                } catch (e) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            })();
        </script>

        <style>
            html[data-theme="dark"] body {
                background-color: #121212;
                color: #e6e6e6;
            }
            html[data-theme="dark"] .text-black {
                color: #e6e6e6 !important;
            }
            html[data-theme="dark"] a:not(.btn) {
                color: #8ab4f8;
            }
            html[data-theme="dark"] .table {
                color: #e6e6e6;
                border-color: #333;
            }
            html[data-theme="dark"] .table td,
            html[data-theme="dark"] .table th {
                border-color: #333;
            }
            html[data-theme="dark"] .table-striped tbody tr:nth-of-type(odd) {
                background-color: rgba(255, 255, 255, 0.05);
            }
            html[data-theme="dark"] .thead-dark th {
                background-color: #1f1f1f;
                border-color: #333;
            }
            html[data-theme="dark"] code {
                color: #ff8fab;
            }

            /* Theme toggle button */
            .theme-toggle {
                position: absolute;
                top: 1rem;
                right: 1rem;
            }
            html[data-theme="dark"] .theme-toggle {
                color: #e6e6e6;
                border-color: #555;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <button id="theme-toggle" type="button" class="btn btn-outline-secondary btn-sm theme-toggle"
                    onclick="toggleTheme()" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
                <i class="fas fa-moon"></i>
            </button>
            <div>
                <div>
                    <h1><i class="fas fa-database"></i> Database Provisioner</h1>
                </div>
                <div>
                    {% block connection %}
                    {% endblock %}
                </div>
            </div>
            {% block content %}
            {% endblock %}
        </div>

        <script>
            function applyToggleIcon() {
                var theme = document.documentElement.getAttribute('data-theme');
                var icon = document.querySelector('#theme-toggle i');
                if (!icon) return;
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
            function toggleTheme() {
                var current = document.documentElement.getAttribute('data-theme');
                var next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
                applyToggleIcon();
            }
            applyToggleIcon();
        </script>
    </body>
</html>
